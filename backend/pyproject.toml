[project]
name = "ltengine"
version = "0.1.0"
description = "LibreTranslate-compatible translation server backed by an external OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.19.0",
    "granian[uvloop]>=2.6.0",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.0.0",
    "ltengine-frontend",
]

[project.scripts]
ltengine = "ltengine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltengine"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "ltengine"
version = "0.1.0"
description = "LibreTranslate-compatible translation server backed by an external OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.19.0",
    "granian[uvloop]>=2.6.0",
    "httpx>=0.28.1",
    "lingua-language-detector>=2.0.0",
    "ltengine-frontend",
]

[project.scripts]
ltengine = "ltengine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltengine"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "prometheus-client>=0.20",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
markers = ["live: hits the real vLLM container; excluded by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true

[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[project]
name = "whatlang-py"
version = "0.1.0"
requires-python = ">=3.12"

[tool.maturin]
# Cargo.toml's [lib] name is "whatlang_py" (underscore); pin the importable
# module name explicitly so it doesn't drift from the hyphenated project name.
module-name = "whatlang_py"

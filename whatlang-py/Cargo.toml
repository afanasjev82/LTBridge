[package]
name = "whatlang-py"
version = "0.1.0"
edition = "2021"

[lib]
name = "whatlang_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
# Pinned to match .rust-ref/ltengine/Cargo.toml's `whatlang = "0.18.0"` exactly
# (both resolve to the same >=0.18.0,<0.19.0 range) — this crate must observe
# byte-identical detection semantics to the oracle.
whatlang = "0.18.0"

[project]
name = "ltengine-frontend"
version = "0.1.0"
description = "Static web UI assets for ltengine"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltengine_frontend"]

[tool.hatch.build.targets.wheel.sources]
"src/ltengine_frontend/static" = "ltengine_frontend/static"

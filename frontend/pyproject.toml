[project]
name = "ltbridge-frontend"
version = "0.1.0"
description = "Static web UI assets for ltbridge"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltbridge_frontend"]

[tool.hatch.build.targets.wheel.sources]
"src/ltbridge_frontend/static" = "ltbridge_frontend/static"

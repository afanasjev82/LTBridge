[tool.uv.workspace]
members = ["backend", "frontend"]

[tool.uv.sources]
ltbridge-frontend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real vLLM container; excluded by default"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
files = ["backend/src"]
